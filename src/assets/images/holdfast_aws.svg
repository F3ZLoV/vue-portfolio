<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
  <defs>
    <marker id="hf2-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#f6f8fa"/>

  <!-- ===== 헤더 ===== -->
  <text x="40" y="54" font-size="27" font-weight="700" fill="#1f2328">HoldFast — AWS 배포 구성</text>
  <text x="40" y="82" font-size="15" fill="#57606a">Terraform으로 전 구성 코드화 · VPC 2AZ 퍼블릭 서브넷 · ECS Fargate desired_count 2</text>
  <text x="1160" y="54" font-size="15" text-anchor="end" fill="#57606a">2026.08 ~ 진행 중</text>
  <text x="1160" y="82" font-size="13" text-anchor="end" fill="#1a7f37" font-weight="700">내린 뒤 잔여 과금 0 실측</text>
  <line x1="40" y1="104" x2="1160" y2="104" stroke="#d8dee4" stroke-width="1"/>

  <!-- ===== 사용자 ===== -->
  <rect x="40" y="316" width="92" height="60" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="86" y="341" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">사용자</text>
  <text x="86" y="359" font-size="11" text-anchor="middle" fill="#57606a">· 관리자</text>
  <line x1="132" y1="346" x2="150" y2="346" stroke="#8c959f" stroke-width="1.5" marker-end="url(#hf2-ar)"/>

  <!-- ===== 엣지 (AWS 밖) ===== -->
  <text x="155" y="264" font-size="11" font-weight="700" fill="#8250df" letter-spacing="0.5">EDGE · ZERO TRUST</text>
  <rect x="155" y="272" width="157" height="148" rx="8" fill="#ffffff" stroke="#8250df" stroke-dasharray="5 3"/>
  <rect x="167" y="286" width="133" height="58" rx="5" fill="#faf7ff" stroke="#d8cdf5"/>
  <text x="179" y="308" font-size="12" font-weight="700" fill="#1f2328">관리자 서브도메인</text>
  <text x="179" y="326" font-size="10.5" fill="#57606a">엣지에서 인증 차단</text>
  <rect x="167" y="352" width="133" height="58" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="179" y="374" font-size="12" font-weight="700" fill="#1f2328">앱은 인증을 모름</text>
  <text x="179" y="392" font-size="10.5" fill="#57606a">인증 로직이 앱 밖</text>
  <line x1="312" y1="346" x2="330" y2="346" stroke="#8c959f" stroke-width="1.5" marker-end="url(#hf2-ar)"/>

  <!-- ===== VPC 컨테이너 ===== -->
  <rect x="336" y="232" width="824" height="202" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <rect x="350" y="242" width="196" height="24" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="448" y="259" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0969da">VPC · 퍼블릭 서브넷 2AZ</text>
  <text x="1146" y="259" font-size="11" text-anchor="end" fill="#57606a">NAT Gateway 없음 — 보안그룹이 유일한 방어</text>

  <!-- ALB (2AZ 가로지름) -->
  <rect x="352" y="272" width="112" height="148" rx="6" fill="#f2f8ff" stroke="#0969da"/>
  <text x="408" y="318" font-size="15" font-weight="700" text-anchor="middle" fill="#0969da">ALB</text>
  <text x="408" y="336" font-size="11" text-anchor="middle" fill="#57606a">HTTPS</text>
  <line x1="366" y1="350" x2="450" y2="350" stroke="#d0d7de"/>
  <text x="408" y="370" font-size="10" text-anchor="middle" fill="#57606a">ACM 와일드카드</text>
  <text x="408" y="386" font-size="10" text-anchor="middle" fill="#57606a">CDN 대역만 허용</text>
  <line x1="464" y1="346" x2="482" y2="346" stroke="#8c959f" stroke-width="1.5" marker-end="url(#hf2-ar)"/>

  <!-- AZ-a -->
  <rect x="488" y="272" width="302" height="70" rx="6" fill="#fbfdfb" stroke="#afb8c1" stroke-dasharray="4 3"/>
  <text x="500" y="289" font-size="10" fill="#57606a">ap-northeast-2a · public subnet</text>
  <rect x="500" y="294" width="278" height="38" rx="5" fill="#ffffff" stroke="#1a7f37"/>
  <text x="512" y="318" font-size="12.5" font-weight="700" fill="#1a7f37">ECS task-1</text>
  <text x="766" y="318" font-size="10.5" text-anchor="end" fill="#57606a">태스크 ID 화면 표시</text>

  <!-- AZ-c -->
  <rect x="488" y="350" width="302" height="70" rx="6" fill="#fbfdfb" stroke="#afb8c1" stroke-dasharray="4 3"/>
  <text x="500" y="367" font-size="10" fill="#57606a">ap-northeast-2c · public subnet</text>
  <rect x="500" y="372" width="278" height="38" rx="5" fill="#ffffff" stroke="#1a7f37"/>
  <text x="512" y="396" font-size="12.5" font-weight="700" fill="#1a7f37">ECS task-2</text>
  <text x="766" y="396" font-size="10.5" text-anchor="end" fill="#57606a">/api/health 헬스체크</text>

  <line x1="790" y1="346" x2="808" y2="346" stroke="#8c959f" stroke-width="1.5" marker-end="url(#hf2-ar)"/>

  <!-- RDS -->
  <rect x="814" y="296" width="196" height="100" rx="6" fill="#fff8f2" stroke="#bc4c00"/>
  <text x="912" y="325" font-size="13" font-weight="700" text-anchor="middle" fill="#bc4c00">RDS PostgreSQL</text>
  <line x1="828" y1="340" x2="996" y2="340" stroke="#f0d3bc"/>
  <text x="912" y="360" font-size="11" text-anchor="middle" fill="#57606a">좌석 단위 점유 제어</text>
  <text x="912" y="378" font-size="10.5" text-anchor="middle" fill="#57606a">락 전략 4종 비교 대상</text>

  <!-- 관리 리소스 -->
  <rect x="1026" y="272" width="120" height="44" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1086" y="291" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2328">SSM Parameter</text>
  <text x="1086" y="306" font-size="9.5" text-anchor="middle" fill="#57606a">자격증명 코드 밖</text>

  <rect x="1026" y="324" width="120" height="44" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1086" y="343" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2328">ECR</text>
  <text x="1086" y="358" font-size="9.5" text-anchor="middle" fill="#57606a">수명주기 정책</text>

  <rect x="1026" y="376" width="120" height="44" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1086" y="395" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2328">CloudWatch</text>
  <text x="1086" y="410" font-size="9.5" text-anchor="middle" fill="#57606a">Logs</text>

  <!-- ===== Terraform 실행 스트립 ===== -->
  <rect x="40" y="442" width="1120" height="28" rx="6" fill="#f3f1fe" stroke="#5c4ee5" stroke-dasharray="5 3"/>
  <text x="56" y="461" font-size="11.5" font-weight="700" fill="#5c4ee5">terraform apply</text>
  <text x="152" y="461" font-size="11" fill="#57606a">단계별 — 무과금 구간 → DB → 엣지 → 전체 · 지정 IAM 사용자 아니면 거부 · plan에 NAT Gateway가 있으면 거부 · 비용 시계는 apply 이전에 시작</text>

  <!-- ===== 하단: 만들지 않은 것 ===== -->
  <text x="40" y="518" font-size="13" font-weight="700" fill="#1f2328">의도적으로 만들지 않은 것</text>
  <text x="222" y="518" font-size="11.5" fill="#57606a">— 각각 이유와 대가를 함께 기록</text>

  <rect x="40" y="532" width="268" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="56" y="552" font-size="12" font-weight="700" fill="#1f2328">NAT Gateway</text>
  <text x="56" y="570" font-size="10.5" fill="#57606a">퍼블릭 서브넷이면 불필요</text>

  <rect x="324" y="532" width="268" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="340" y="552" font-size="12" font-weight="700" fill="#1f2328">ALB 인터넷 전체 공개</text>
  <text x="340" y="570" font-size="10.5" fill="#57606a">대역 목록은 apply 시점 API 조회</text>

  <rect x="608" y="532" width="268" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="624" y="552" font-size="12" font-weight="700" fill="#1f2328">/actuator 헬스체크</text>
  <text x="624" y="570" font-size="10.5" fill="#57606a">로컬 실측 503 → 미리 회피</text>

  <rect x="892" y="532" width="268" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="908" y="552" font-size="12" font-weight="700" fill="#1f2328">캐시 계층</text>
  <text x="908" y="570" font-size="10.5" fill="#57606a">시연 구성과 배포 구성 일치</text>

  <line x1="40" y1="606" x2="1160" y2="606" stroke="#d8dee4"/>
  <text x="40" y="628" font-size="11" fill="#8c959f">미완 — 엣지·앱 동시 기동 상태 통합 검증 · 모니터링/알림 없음 · 단일 리전 · 단일 환경 · CI에서 apply 하지 않음</text>
</svg>
